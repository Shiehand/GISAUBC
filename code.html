<!DOCTYPE html>
<html lang="en">
    <head>
        <meta
            charset="UTF-8"
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />
        <title>Gado-Gado Indonesian Student Association UBC</title>
        <link rel="stylesheet" href="css/reset.css" />
        <!--BOOTSTRAP-->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x"
            crossorigin="anonymous"
        />
        <!--BOOTSTRAP-->
        <link rel="shortcut icon" href="media/favicon.png" />
        <!--CAROUSEL-->
        <link rel="stylesheet" href="css/flickity.css" />
        <script src="css/flickity.pkgd.js"></script>
        <!-- jQuery library -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
        <!-- Latest compiled JavaScript -->
        <script src="css/googleanalytics.js"></script>
        <!-- CSS -->
        <link rel="stylesheet" href="css/navigation-style.css" />
        <link rel="stylesheet" href="css/home.css" />
        <link rel="stylesheet" href="css/about.css" />
        <link rel="stylesheet" href="css/code.css" />
        <!-- JS -->
        <script type="text/javascript" src="css/navbar.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4"
            crossorigin="anonymous"
        ></script>
    </head>
    <body>
        <div id="nav-placeholder"></div>
        <div class="content">
            <h2 class="title">
                Can you find the hidden codes in our Dare to Share videos???
                Enter your answer here to win awesome prizes!!!
            </h2>
            <div class="form">
                <form id="formElem">
                    <label for="email">E-mail:</label>
                    <input
                        type="text"
                        name="email"
                        placeholder="user@example.com"
                    />
                    <br />
                    <label for="email">First Name:</label>
                    <input type="text" name="firstname" placeholder="John" />
                    <label for="email">Last Name:</label>
                    <input type="text" name="lastname" placeholder="Doe" />
                    <br />
                    <label for="answer">Your answer:</label>
                    <input
                        type="text"
                        name="answer"
                        placeholder="Type your answer here!"
                    />
                    <input type="submit" />
                </form>
            </div>
        </div>
    </body>
    <footer id="footer"></footer>
    <script>
        formElem.onsubmit = async (e) => {
            e.preventDefault();
            var form = document.querySelector("#formElem");
            // var form = document.forms[0];

            data = {
                firstName: form.querySelector('input[name="firstname"]').value,
                lastName: form.querySelector('input[name="lastname"]').value,
                answer: form.querySelector('input[name="answer"]').value,
                email: form.querySelector('input[name="email"]').value,
            };

            let response = await fetch(
                "https://2xc2e9zh04.execute-api.us-east-1.amazonaws.com/",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(data),
                }
            );
            if (response.status === 200) {
                alert("Answer submitted! Thank you for participating");
            }
        };
    </script>
</html>
